name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Selene
        run: |
          curl -L https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip -o selene.zip
          unzip selene.zip
          chmod +x selene
          mv selene /usr/local/bin

      - name: Lint Code
        run: selene src

      - name: Build package
        run: |
          curl -L https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux.zip -o rojo.zip
          unzip rojo.zip
          chmod +x rojo
          ./rojo build pack.project.json --output NeuroService.rbxm
